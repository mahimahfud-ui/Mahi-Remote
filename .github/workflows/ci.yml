name: Mahi Remote CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend
      - name: Compile TypeScript
        run: npm run build
        working-directory: backend
      - name: Run security and integration tests
        run: npm test
        working-directory: backend

  android:
    name: Android build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # This repository has wrapper properties but no gradlew script/JAR.
      # Install the exact Gradle distribution declared by gradle-wrapper.properties.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Build and test Android app
        env:
          MAHI_UI_RELEASE_PUBLIC_KEY_BASE64: ''
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

  windows:
    name: Windows controller build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build WPF solution
        run: dotnet build windows-controller/MahiRemote.sln --configuration Release
