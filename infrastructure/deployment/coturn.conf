# Coturn uses TURN_SHARED_SECRET from the container environment via the
# docker-compose command line. Never put the secret in this tracked file.
listening-port=3478
tls-listening-port=5349
fingerprint
lt-cred-mech
use-auth-secret
realm=turn.example.com
total-quota=100
bps-capacity=0
stale-nonce
no-loopback-peers
no-multicast-peers
min-port=49152
max-port=65535
verbose
